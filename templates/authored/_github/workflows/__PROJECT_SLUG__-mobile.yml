name: __PROJECT_SLUG__-mobile

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "packages/stubs/**"
      - ".github/workflows/__PROJECT_SLUG__-mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "packages/stubs/**"
      - ".github/workflows/__PROJECT_SLUG__-mobile.yml"

defaults:
  run:
    working-directory: mobile

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This workspace is generated without a lockfile: the first local
      # `pnpm install` writes one. Say so plainly rather than letting
      # setup-node's cache step or --frozen-lockfile fail cryptically.
      - name: Require a committed lockfile
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error file=mobile/package.json::mobile/pnpm-lock.yaml is not committed. Run pnpm install in mobile/ and commit the lockfile."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Locale catalogues
        run: pnpm check:locales

      - name: Test
        run: pnpm test
