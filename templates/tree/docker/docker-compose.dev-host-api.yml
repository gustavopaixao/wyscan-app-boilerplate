# Nginx proxies to API on host (host.docker.internal:3000). Stop api container first.
# api-watch runs the API on the host — do not start/build the docker api service here.
services:
  api:
    profiles:
      - docker-api-container
  # log-agent depends_on api, so it must leave the default profile together
  # with it (fixes "depends on undefined service" from the reference project).
  log-agent:
    profiles:
      - docker-api-container
  nginx:
    volumes:
      - ./nginx/nginx.dev.host-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: !reset null
    extra_hosts:
      - "host.docker.internal:host-gateway"
